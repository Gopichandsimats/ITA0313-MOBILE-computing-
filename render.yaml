services:
  - type: web
    name: fixwise-diagnostic-api
    runtime: python
    plan: free
    rootDir: FixWise/backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: FIXWISE_DB_PATH
        value: /tmp/fixwise.db
      - key: CORS_ORIGINS
        value: "*"
