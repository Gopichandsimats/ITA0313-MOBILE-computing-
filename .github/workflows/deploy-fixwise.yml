name: Deploy FixWise and Device Care to GitHub Pages
on:
  push:
    branches: [main]
    paths:
      - 'FixWise/**'
      - 'Capstone/DeviceCare/web/**'
      - '.github/workflows/deploy-fixwise.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Assemble both web apps
        run: |
          mkdir -p public/DeviceCare
          cp -a FixWise/. public/
          cp -a Capstone/DeviceCare/web/. public/DeviceCare/
      - name: Upload combined site
        uses: actions/upload-pages-artifact@v3
        with:
          path: public
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
