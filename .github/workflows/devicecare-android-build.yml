name: Device Care Android APK

on:
  push:
    paths:
      - "Capstone/DeviceCare/**"
      - ".github/workflows/devicecare-android-build.yml"
  pull_request:
    paths:
      - "Capstone/DeviceCare/**"
      - ".github/workflows/devicecare-android-build.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Capstone/DeviceCare
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Generate Gradle wrapper
        run: gradle wrapper --gradle-version 8.9
      - name: Build debug APK
        run: ./gradlew assembleDebug
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: device-care-debug-apk
          path: Capstone/DeviceCare/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
